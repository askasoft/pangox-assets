<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	</meta>
	<link href="../../html/bootstrap5/css/bootstrap.css" rel="stylesheet" type="text/css" />
	<link href="../../html/fontawesome6/css/all.css" rel="stylesheet" type="text/css" />
</head>

<style>
	@keyframes zoom-in-anim {
		0% {
			transform: scale(0);
		}
		100% {
			transform: scale(1);
		}
	}

	@keyframes zoom-out-anim {
		0% {
			transform: scale(1);
		}
		100% {
			transform: scale(0);
		}
	}
</style>

<body>
	<div style="padding: 20px">
		<h1 style="text-align: center; margin: 20px 0px;">jQuery Animate Plugin</h1>
		<hr>

		<div class="text-center" id="buttons">
			<button class="btn btn-sm btn-primary" id="cssZoomIn">CSS Zoom In</button>
			<button class="btn btn-sm btn-primary" id="cssZoomOut">CSS Zoom Out</button>
			<button class="btn btn-sm btn-primary" id="zoomIn">Zoom In</button>
			<button class="btn btn-sm btn-primary" id="zoomOut">Zoom Out</button>
			<button class="btn btn-sm btn-primary" id="zoomToggle">Zoom Toggle</button>
			<button class="btn btn-sm btn-primary" id="scaleIn">Scale In</button>
			<button class="btn btn-sm btn-primary" id="scaleOut">Scale Out</button>
			<button class="btn btn-sm btn-primary" id="scaleToggle">Scale Toggle</button>
			<button class="btn btn-sm btn-primary" id="slideIn">Slide In</button>
			<button class="btn btn-sm btn-primary" id="slideOut">Slide Out</button>
			<button class="btn btn-sm btn-primary" id="slideInOut">Slide InOut</button>
		</div>
		<hr>

		<div class="d-flex flex-column align-items-center">
		<div id="container" style="width:fit-content;">
		<table class="table table-striped table-bordered w-auto">
			<thead>
				<tr>
					<th>#</th>
					<th>First Name</th>
					<th>Last Name</th>
					<th>First Name</th>
					<th>Last Name</th>
					<th>Username</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<th scope="row">1</th>
					<td>Mark</td>
					<td>Otto</td>
					<td>Mark</td>
					<td>Otto</td>
					<td>@mdo</td>
				</tr>
				<tr>
					<th scope="row">2</th>
					<td>Jacob</td>
					<td>Thornton</td>
					<td>Jacob</td>
					<td>Thornton</td>
					<td>@fat</td>
				</tr>
				<tr>
					<th scope="row">3</th>
					<td>Larry</td>
					<td>the Bird</td>
					<td>Larry</td>
					<td>the Bird</td>
					<td>@twitter</td>
				</tr>
				<tr>
					<th scope="row">4</th>
					<td>Tom</td>
					<td>Otto</td>
					<td>Tom</td>
					<td>Otto</td>
					<td>@tom</td>
				</tr>
				<tr>
					<th scope="row">5</th>
					<td>Jerry</td>
					<td>Thornton</td>
					<td>Jerry</td>
					<td>Thornton</td>
					<td>@jerry</td>
				</tr>
				<tr>
					<th scope="row">6</th>
					<td>Hydra</td>
					<td>the Bird</td>
					<td>Hydra</td>
					<td>the Bird</td>
					<td>@hydra</td>
				</tr>
			</tbody>
		</table>
		</div></div>
	</div>

	<script src="../../html/jquery3/jquery-3.7.1.js"></script>
	<script src="../../html/plugins/js/jquery.ui.animate.js" type="text/javascript"></script>

	<script type="text/javascript">
		$(function() {
			$.fn.cssZoomIn = function() {
				$(this).css('animation', 'zoom-in-anim .5s');
			};
			$.fn.cssZoomOut = function() {
				$(this).css('animation', 'zoom-out-anim .5s');
			};

			$('#buttons').on('click', 'button', function() {
				$('#container')[$(this).attr('id')]('slow');
			});
		});
	</script>
</body>

</html>
