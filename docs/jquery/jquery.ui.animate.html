<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	</meta>
	<link href="../../html/bootstrap3/css/bootstrap.css" rel="stylesheet" type="text/css" />
	<link href="../../html/fontawesome4/css/font-awesome.css" rel="stylesheet" type="text/css" />
</head>

<style>
	@keyframes zoom-in-anim {
		0% {
			transform: scale(0);
		}
		100% {
			transform: scale(1);
		}
	}

	@keyframes zoom-out-anim {
		0% {
			transform: scale(1);
		}
		100% {
			transform: scale(0);
		}
	}
</style>

<body>
	<div style="padding: 20px">
		<h1 style="text-align: center; margin: 20px 0px;">jQuery Animate Plugin</h1>
		<hr>

		<div class="text-center" id="buttons">
			<button class="btn btn-primary" id="scaleIn">Css Scale In</button>
			<button class="btn btn-primary" id="scaleOut">Css Scale Out</button>
			<button class="btn btn-primary" id="zoomIn">jQ Zoom In</button>
			<button class="btn btn-primary" id="zoomOut">jQ Zoom Out</button>
			<button class="btn btn-primary" id="zoomToggle">jQ Zoom Toggle</button>
			<button class="btn btn-primary" id="slideIn">jQ Slide In</button>
			<button class="btn btn-primary" id="slideOut">jQ Slide Out</button>
			<button class="btn btn-primary" id="slideToggle">jQ Slide Toggle</button>
		</div>
		<hr>

		<table id="table" class="table table-striped table-bordered">
			<thead>
				<tr>
					<th>#</th>
					<th>First Name</th>
					<th>Last Name</th>
					<th>First Name</th>
					<th>Last Name</th>
					<th>Username</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<th scope="row">1</th>
					<td>Mark</td>
					<td>Otto</td>
					<td>Mark</td>
					<td>Otto</td>
					<td>@mdo</td>
				</tr>
				<tr>
					<th scope="row">2</th>
					<td>Jacob</td>
					<td>Thornton</td>
					<td>Jacob</td>
					<td>Thornton</td>
					<td>@fat</td>
				</tr>
				<tr>
					<th scope="row">3</th>
					<td>Larry</td>
					<td>the Bird</td>
					<td>Larry</td>
					<td>the Bird</td>
					<td>@twitter</td>
				</tr>
				<tr>
					<th scope="row">4</th>
					<td>Tom</td>
					<td>Otto</td>
					<td>Tom</td>
					<td>Otto</td>
					<td>@tom</td>
				</tr>
				<tr>
					<th scope="row">5</th>
					<td>Jerry</td>
					<td>Thornton</td>
					<td>Jerry</td>
					<td>Thornton</td>
					<td>@jerry</td>
				</tr>
				<tr>
					<th scope="row">6</th>
					<td>Hydra</td>
					<td>the Bird</td>
					<td>Hydra</td>
					<td>the Bird</td>
					<td>@hydra</td>
				</tr>
			</tbody>
		</table>

	</div>

	<script src="../../html/jquery1/jquery-1.12.4.js"></script>
	<script src="../../html/plugins/js/jquery.ui.animate.js" type="text/javascript"></script>

	<script type="text/javascript">
		$(function() {
			$.fn.scaleIn = function() {
				$(this).css('animation', 'zoom-in-anim .5s');
			};
			$.fn.scaleOut = function() {
				$(this).css('animation', 'zoom-out-anim .5s');
			};

			$('#buttons').on('click', 'button', function() {
				$('#table')[$(this).attr('id')]();
			});
		});
	</script>
</body>

</html>
