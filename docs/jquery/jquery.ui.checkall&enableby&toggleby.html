<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>JQuery CheckAll / EnableBy / HiddenBy Plugin</title>
	<link href="../../html/bootstrap5/css/bootstrap.css" rel="stylesheet" type="text/css" />
	<style>
		.hh {
			display: none !important;
		}
	</style>
</head>

<body>
	<div class="container">
		<h1 style="text-align: center; margin: 20px 0px;">JQuery CheckAll / EnableBy / HiddenBy Plugin</h1>
		<hr>

		<fieldset>
			<legend>
				<label>
					<input type="checkbox" id="ca" checkall="#checks .sub"/>
					Checkall
				</label>
			</legend>

			<div id="checks">
				<div class="row">
					<div class="col-sm-2">
						<label><input type="checkbox" id="iapple" class="sub" checkall="#apples input"/> Apple</label>
					</div>
					<div class="col-sm-4" id="apples">
						<label><input type="checkbox"/> Apple 1</label>
						<label><input type="checkbox"/> Apple 2</label>
						<label><input type="checkbox"/> Apple 3</label>
					</div>
					<div class="col-sm-6">
						<button class="btn btn-primary" enableby="#iapple"> Enable By APPLE ALL</button>
						<button class="btn btn-primary" enableby="#apples input"> Enable By APPLE 1/2/3</button>
						<hr>
						<button class="btn btn-secondary hidden" toggleby-class="hh" toggleby="#iapple"> Hidden By APPLE ALL</button>
						<button class="btn btn-secondary hidden" toggleby-class="hh" toggleby="#apples input"> Hidden By APPLE 1/2/3</button>
					</div>
				</div>
				<hr/>
				<div class="row">
					<div class="col-sm-2">
						<label><input type="checkbox" id="ibanana" class="sub" checkall="#bananas input"/> Banana</label>
					</div>
					<div class="col-sm-4" id="bananas">
						<label><input type="checkbox"/> Banana 1</label>
						<label><input type="checkbox"/> Banana 2</label>
						<label><input type="checkbox"/> Banana 3</label>
					</div>
					<div class="col-sm-6">
						<button class="btn btn-primary" enableby="#ibanana"> Enable By BANANA ALL</button>
						<button class="btn btn-primary" enableby="#bananas input"> Enable By BANANA 1/2/3</button>
						<hr>
						<button class="btn btn-secondary hidden" toggleby-class="hh" toggleby="#ibanana"> Hidden By BANANA ALL</button>
						<button class="btn btn-secondary hidden" toggleby-class="hh" toggleby="#bananas input"> Hidden By BANANA 1/2/3</button>
					</div>
				</div>
				<hr/>
				<div class="row">
					<div class="col-sm-2">
						<label><input type="checkbox" id="ipear" class="sub" checkall="#pears input"/> Pear</label>
					</div>
					<div class="col-sm-4" id="pears">
						<label><input type="checkbox" checked/> Pear 1</label>
						<label><input type="checkbox" checked/> Pear 2</label>
						<label><input type="checkbox" checked/> Pear 3</label>
					</div>
					<div class="col-sm-6">
						<button class="btn btn-primary" enableby="#ipear"> Enable By PEAR</button>
						<button class="btn btn-primary" enableby="#pears input"> Enable By PEAR 1/2/3</button>
						<hr>
						<button class="btn btn-secondary hidden" toggleby-class="hh" toggleby="#ipear"> Hidden By PEAR</button>
						<button class="btn btn-secondary hidden" toggleby-class="hh" toggleby="#pears input"> Hidden By PEAR 1/2/3</button>
					</div>
				</div>
			</div>
		</fieldset>
	</div>

	<script src="../../html/jquery3/jquery-3.7.1.js"></script>
	<script src="../../html/plugins/js/jquery.ui.checkall.js"></script>
	<script src="../../html/plugins/js/jquery.ui.enableby.js"></script>
	<script src="../../html/plugins/js/jquery.ui.toggleby.js"></script>
</body>

</html>
