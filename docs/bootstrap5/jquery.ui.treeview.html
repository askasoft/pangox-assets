<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>JQuery TreeView Plugin</title>
	<link href="../../html/bootstrap5/css/bootstrap.css" rel="stylesheet" type="text/css" />
	<link href="../../html/fontawesome6/css/all.css" rel="stylesheet" type="text/css" />
	<link href="../../html/plugins/css/jquery.ui.treeview.css" rel="stylesheet" type="text/css" />
</head>

<body>
	<div class="container">
		<h1 style="text-align: center; margin: 20px 0px;">JQuery TreeView Plugin</h1>
		<hr>

		<div id="themes" class="text-center">
			Theme:
			<button id="light" class="btn btn-primary">Light</button>
			<button id="dark" class="btn btn-secondary">Dark</button>
		</div>
		<hr>

		<div id="styles" class="text-center">
			Style:
			&nbsp;&nbsp;<label><input value="lined"  type="checkbox"> lined </label>
			&nbsp;&nbsp;<label><input value="boxed"  type="checkbox"> boxed </label>
			&nbsp;&nbsp;<label><input value="sticky" type="checkbox"> sticky</label>
			&nbsp;&nbsp;<label><input value="topdown" type="checkbox"> topdown</label>
			&nbsp;&nbsp;<label><input value="arrow"  type="checkbox"> arrow </label>
			&nbsp;&nbsp;<label><input value="indent" type="checkbox"> indent</label>
			&nbsp;&nbsp;<label><input value="collapser"  type="checkbox"> collapser </label>
		</div>
		<hr>

		<div id="methods" class="text-center">
			Method:
			<button id="init" class="btn btn-primary">init</button>
			<button id="dispose" class="btn btn-secondary">dispose</button>
			<button id="expand" class="btn btn-primary">expand</button>
			<button id="collapse" class="btn btn-secondary">collapse</button>
		</div>
		<hr>

		<ul id="treeview" class="ui-tree clickable draggable" data-spy="treeview">
			<li>
				<div class="item"><b>Animals</b></div>
				<ul>
					<li>
						<div class="item">Birds</div>
						<ul>
							<li>
								<div class="item">Pigeon</div>
							</li>
						</ul>
					</li>
					<li>
						<div class="item">Mammals</div>
						<ul>
							<li>
								<div class="item">Elephant</div>
								<ul>
									<li>
										<div class="item">Lion</div>
										<ul>
											<li>
												<div class="item">Tiger</div>
											</li>
										</ul>
									</li>
								</ul>
							</li>
							<li>
								<div class="item">Mouse</div>
							</li>
						</ul>
					</li>
					<li>
						<div class="item">Reptiles</div>
						<ul>
							<li>
								<div class="item">Cat</div>
								<ul>
									<li>
										<div class="item">Dog</div>
									</li>
								</ul>
							</li>
						</ul>
					</li>
				</ul>
			</li>
			<li>
				<div class="item">Plants</div>
				<ul>
					<li>
						<div class="item">Flowers</div>
						<ul>
							<li>
								<div class="item">Rose</div>
							</li>
							<li>
								<div class="item">Tulip</div>
							</li>
						</ul>
					</li>
					<li>
						<div class="item">Trees</div>
					</li>
				</ul>
			</li>
		</ul>

		<hr>
		<br><br><br><br><br><br><br><br><br><br><br><br>
		<br><br><br><br><br><br><br><br><br><br><br><br>
		<br><br><br><br><br><br><br><br><br><br><br><br>
		<br><br><br><br><br><br><br><br><br><br><br><br>
	</div>

	<script src="../../html/jquery3/jquery-3.7.1.js"></script>
	<script src="../../html/bootstrap5/js/bootstrap.bundle.js"></script>
	<script src="../../html/plugins/js/jquery.ui.treeview.js"></script>
	<script>
		$(window).on('load', function() {
			$('#light, #dark').click(function() {
				$('body').attr('data-bs-theme', $(this).attr('id'));
			});
			$('#styles input').change(function() {
				$('#treeview')[$(this).prop('checked') ? 'addClass' : 'removeClass']($(this).val());
			}).each(function() {
				$(this).trigger('change');
			});
			$('#methods > button').click(function() {
				$('#treeview').treeview($(this).attr('id'));
			});
		});
	</script>
</body>

</html>
